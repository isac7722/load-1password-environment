name: Verify Action
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify architecture and distribution
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if(process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
          npm ci
          npm run check
          git diff --exit-code -- dist
      - name: Export fixture through the real GitHub environment file
        run: node --experimental-strip-types scripts/environment-roundtrip.ts export
      - name: Verify environment values in the following step
        run: node --experimental-strip-types scripts/environment-roundtrip.ts verify
