name: Load 1Password Environment
description: Masks selected 1Password Environment variables and passes them to subsequent steps.
author: isac7722
branding:
  icon: lock
  color: blue
inputs:
  service-account-token:
    description: Service account token with read access to the target Environment
    required: true
  environment-id:
    description: 1Password Environment ID
    required: true
  variables:
    description: One NAME or DEST=SOURCE per line. Every requested value is required.
    required: true
runs:
  using: node24
  main: dist/index.js
